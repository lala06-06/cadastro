<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Globo Play - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: white;
            min-height: 100vh;
        }

        header {
            background-color: #111;
            padding: 20px 40px;
            border-bottom: 1px solid #333;
        }

        header h1 {
            font-size: 28px;
        }

        .login-container {
            display: flex;
            max-width: 1100px;
            width: 90%;
            margin: 40px auto;
            background-color: #151515;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px #000;
        }

        .imagem-login {
            width: 50%;
            min-height: 600px;
        }

        .imagem-login img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .login-box {
            width: 50%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-box h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .login-box > p {
            color: #bbb;
            margin-bottom: 25px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #222;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff1744;
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #ff1744;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #d50032;
        }

        .botoes-dados {
            margin-top: 10px;
        }

        .botoes-dados input {
            margin-bottom: 12px;
        }

        .esqueci-minha-senha {
            text-align: right;
            margin: 10px 0 20px;
        }

        a {
            color: #ff1744;
            text-decoration: none;
            font-size: 14px;
        }

        a:hover {
            text-decoration: underline;
        }

        #mensagem {
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }

        .cadastro {
            text-align: center;
            margin-top: 20px;
            color: #bbb;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }

            .imagem-login {
                width: 100%;
                min-height: 220px;
                height: 220px;
            }

            .login-box {
                width: 100%;
                padding: 25px;
            }

            header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Globo Play</h1>
    </header>

    <main class="login-container">

        <div class="imagem-login">
            <img src="fundo.png" alt="Filmes e séries">
        </div>

        <div class="login-box">

            <h2>Entrar</h2>

            <p>Acesse sua conta para continuar.</p>

            <form id="loginForm">

                <!-- E-mail -->
                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <!-- Senha -->
                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <!-- Botões dos dados pessoais -->
                <div class="botoes-dados">

                    <button type="button"
                        onclick="mostrarCampo('nome')">
                        Nome
                    </button>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                        hidden
                    >

                    <button type="button"
                        onclick="mostrarCampo('endereco')">
                        Endereço
                    </button>

                    <input
                        type="text"
                        id="endereco"
                        placeholder="Digite seu endereço"
                        hidden
                    >

                    <button type="button"
                        onclick="mostrarCampo('cpf')">
                        CPF
                    </button>

                    <input
                        type="text"
                        id="cpf"
                        placeholder="Digite seu CPF"
                        maxlength="14"
                        hidden
                    >

                    <button type="button"
                        onclick="mostrarCampo('imagem')">
                        Imagem
                    </button>

                    <input
                        type="url"
                        id="imagem"
                        placeholder="Digite o URL da sua imagem"
                        hidden
                    >

                </div>

                <!-- Recuperação de senha -->
                <div class="esqueci-minha-senha">
                    <a href="#" onclick="esqueciSenha(event)">
                        Esqueci minha senha
                    </a>
                </div>

                <!-- Entrar -->
                <button type="submit">
                    Entrar
                </button>

                <p id="mensagem"></p>

            </form>

            <!-- Cadastro -->
            <p class="cadastro">
                Ainda não possui uma conta?

                <a href="#" onclick="criarConta(event)">
                    Criar conta
                </a>
            </p>

        </div>

    </main>

    <script>
        // Mostrar e esconder os campos
        function mostrarCampo(id) {
            const campo = document.getElementById(id);

            campo.hidden = !campo.hidden;

            if (!campo.hidden) {
                campo.focus();
            }
        }

        // Formulário de login demonstrativo
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const mensagem =
                    document.getElementById("mensagem");

                mensagem.style.color = "#4caf50";

                mensagem.textContent =
                    "Formulário preenchido com sucesso!";

            });

        // Recuperar senha
        function esqueciSenha(event) {
            event.preventDefault();

            document.getElementById("mensagem")
                .textContent =
                "A página de recuperação de senha ainda não foi criada.";

            document.getElementById("mensagem")
                .style.color = "#ff1744";
        }

        // Criar conta
        function criarConta(event) {
            event.preventDefault();

            document.getElementById("mensagem")
                .textContent =
                "A página de cadastro ainda não foi criada.";

            document.getElementById("mensagem")
                .style.color = "#ff1744";
        }
    </script>

</body>
</html>
